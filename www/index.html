<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SynapseMed</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>SynapseMed</h1>
    <button id="settings-btn" class="icon-btn" aria-label="إعدادات">⚙️</button>
  </header>

  <div id="update-banner" hidden>
    <button id="update-btn">⬇️ تحديث المحاكيات</button>
  </div>

  <main id="sim-list" class="sim-list"></main>

  <footer class="disclaimer">
    للاستخدام التعليمي فقط، وليس بديلاً عن التدريب السريري.
  </footer>

  <div id="settings-overlay" class="overlay" hidden>
    <div class="settings-panel">
      <h2>الإعدادات</h2>
      <input type="file" id="import-file" accept=".html,text/html" hidden>
      <button id="import-btn" class="btn">📥 استيراد محاكي من الجهاز</button>
      <button id="reset-btn" class="btn btn-warn">🗑️ إعادة تعيين القائمة (حذف المستورد/المحدَّث)</button>
      <button id="close-settings" class="btn btn-secondary">إغلاق</button>
      <p class="small">الإصدار 1.0.0</p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
