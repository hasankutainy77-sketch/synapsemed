<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>حالة سريرية — ألم بطني</title>
<style>

</style>
</head>
<body>
<div class="box">
  <h1>🚧 محاكي مؤقت</h1>
  <p>هذا ملف تجريبي للتأكد من عمل التطبيق.</p>
  <p>سيتم استبداله بالملف الأصلي قريبًا.</p>
  <div class="badge">حالة سريرية — ألم بطني</div>
</div>
</body>
</html>
